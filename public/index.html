<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pAIssible - Live Capability Proof</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 0.5rem;
        }
        p {
            font-size: 1.1rem;
            margin: 1rem 0;
        }
        .timestamp {
            background-color: #ecf0f1;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 2rem;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>pAIssible built and deployed this page.</h1>
    <p>This page was created, built, tested, and deployed end-to-end by pAIssible as a live capability proof. It demonstrates the ability to generate, configure, and deploy a complete software delivery pipeline.</p>
    <div class="timestamp">
        <strong>Live Timestamp:</strong>
        <div id="timestamp">Loading...</div>
    </div>
    <script>
        function updateTimestamp() {
            const now = new Date();
            const formatted = now.toLocaleString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZoneName: 'short'
            });
            document.getElementById('timestamp').textContent = formatted;
        }
        updateTimestamp();
        setInterval(updateTimestamp, 1000);
    </script>
</body>
</html>
